name: Keep database awake

# Neon-un pulsuz planı 5 dəqiqə fəaliyyətsizlikdən sonra bazanı yuxuya
# göndərir — bu, saytın (Anarın/ziyarətçilərin şikayəti, 2026-09-16)
# "arada açılmır" problemi ilə eyni idi. Hər 5 dəqiqədə bir sadə bir
# sorğu göndərməklə bazanı daim oyaq saxlayırıq (xarici hesab/servis
# yaratmağa ehtiyac olmadan, mövcud GitHub repo-nun öz cron-u ilə).
#
# QEYD: GitHub scheduled workflow-lar repo-da 60 gün heç bir commit
# olmasa avtomatik dayanır — əgər bu layihə uzun müddət toxunulmaz
# qalsa, cron-u yenidən aktivləşdirmək üçün boş bir commit kifayətdir.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: curl -fsS --max-time 20 https://travelguidebaku.com/api/keepalive
